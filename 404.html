<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Page Redirect</title>
		<script type="text/javascript">
			// Redirect to index.html while keeping the current path
			const pathname = window.location.pathname;
			window.location.href = window.location.origin + '/index.html' + pathname;
		</script>
	</head>
	<body></body>
</html>
